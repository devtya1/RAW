<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Launch Sequence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            background: linear-gradient(to right, #141e30, #243b55);
            color: #00FF00;
            font-family: 'Orbitron', sans-serif; /* Updated to Orbitron */
            text-align: center;
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 4em;
            color: #00FF00;
            margin: 0;
            padding: 0;
        }

        h2 {
            font-size: 2em;
            color: #00FF00;
            margin: 10px 0;
        }

        h3 {
            font-size: 1.5em;
            color: #00FF00;
            margin: 5px 0;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .launch-container, .modal-content, .country-modal-content, .countdown-container, .error-screen, .abort-screen, .launch-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .launch-button, .abort-button, .back-button, .back-to-launch-button, .submit-code, .submit-country {
            display: inline-block;
            background: #FF0000;
            color: white;
            padding: 20px;
            font-size: 2em;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            margin: 10px;
            transition: background 0.3s ease;
            font-family: 'Orbitron', sans-serif;
        }

        .launch-button:hover, .abort-button:hover, .back-button:hover, .back-to-launch-button:hover {
            background: #FF4500;
        }

        .modal, .country-modal, .error-screen, .abort-screen, .launch-screen {
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: #00FF00;
            text-align: center;
        }

        .modal-content, .country-modal-content {
            background-color: #111;
            margin: auto;
            padding: 20px;
            border: 1px solid #333;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        .modal input[type="text"], .country-modal select {
            width: 80%;
            padding: 10px;
            font-size: 1.5em;
            border-radius: 5px;
            border: 1px solid #00FF00;
            background-color: black;
            color: #00FF00;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }

        .submit-code, .submit-country {
            background: #00FF00;
            color: black;
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
        }

        .countdown-container {
            display: none;
            background: rgba(0, 0, 0, 0.8); /* Dark semi-transparent background */
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #FF0000;
            box-shadow: 0 0 20px #FF0000;
            font-size: 3em; /* Adjusted font size */
            color: #FF0000; /* Red for urgency */
            text-shadow: 0 0 10px #FF0000, 0 0 20px #FF0000, 0 0 30px #FF0000; /* Glow effect */
            letter-spacing: 0.1em;
            animation: flicker 0.5s infinite alternate; /* Subtle flicker effect */
        }

        @keyframes flicker {
            0% {
                opacity: 1;
                text-shadow: 0 0 10px #FF0000, 0 0 20px #FF0000, 0 0 30px #FF0000;
            }
            50% {
                opacity: 0.9;
                text-shadow: 0 0 5px #FF0000, 0 0 15px #FF0000, 0 0 25px #FF0000;
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 10px #FF0000, 0 0 20px #FF0000, 0 0 30px #FF0000;
            }
        }

        .error-screen, .abort-screen {
            display: none;
            background-color: black;
            color: #FF0000;
            text-align: center;
            height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2;
        }

        .error-screen h1, .abort-screen h1 {
            margin-top: 20%;
            font-size: 3em;
        }

        .error-screen .flicker-light, .abort-screen .flicker-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.2);
            opacity: 0;
            animation: flicker 0.1s infinite alternate;
        }

        .launch-screen {
            display: none;
            position: fixed;
            z-index: 3;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: #00FF00;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .launch-screen h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .launch-screen video {
            max-width: 90%;
            max-height: 60vh; /* Adjusted max height */
            border: 2px solid #00FF00;
            border-radius: 10px;
        }

        .launch-screen .countdown {
            font-size: 2em;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .launch-button, .abort-button, .back-button, .back-to-launch-button, .submit-code, .submit-country {
                font-size: 1.5em;
                padding: 15px;
            }

            .modal input[type="text"], .country-modal select {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Main Heading -->
    <h1>Nuclear Launch Sequence</h1>
    <h3>Research and Analysis Wing</h3>

    <!-- Launch Button -->
    <div class="launch-container">
        <button class="launch-button" id="launchButton" onclick="showCodeModal()">Launch!</button>
    </div>

    <!-- Modal for Code Entry -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <h2>Enter Launch Code</h2>
            <input type="text" id="launchCode" placeholder="Enter Code">
            <br>
            <button class="submit-code" onclick="validateCode()">Submit</button>
        </div>
    </div>

    <!-- Modal for Country Selection -->
    <div id="countryModal" class="country-modal">
        <div class="country-modal-content">
            <h2>Select Target Country</h2>
            <select id="countrySelect">
                <option value="" disabled selected>Select Country</option>
                <option value="United States">United States</option>
                <option value="Russia">Russia</option>
                <option value="China">China</option>
                <option value="India">India</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="France">France</option>
                <option value="North Korea">North Korea</option>
                <!-- Add more countries as needed -->
            </select>
            <br>
            <button class="submit-country" onclick="confirmCountry()">Select Country</button>
        </div>
    </div>

    <!-- Countdown Timer -->
    <div class="countdown-container" id="countdownContainer">
        <h4 id="targetCountryHeading"></h4>
        <div id="countdown"></div>
        <button class="abort-button" onclick="abortLaunch()">Abort</button>
    </div>

    <!-- Error Screen -->
    <div id="errorScreen" class="error-screen">
        <div class="flicker-light"></div>
        <h1>Incorrect Code - Access Denied!</h1>
        <button class="back-button" onclick="returnToLaunchScreen()">Back</button>
    </div>

    <!-- Abort Screen -->
    <div id="abortScreen" class="abort-screen">
        <div class="flicker-light"></div>
        <h1>Missile Abort</h1>
        <button class="back-to-launch-button" onclick="returnToLaunchScreen()">Back to Launch</button>
    </div>

    <!-- Launch Screen -->
    <div id="launchScreen" class="launch-screen">
        <h2 id="launched">Missile Launched!</h2>
        <video id="launchVideo" src="1107498499-preview.mp4" autoplay muted></video>
        <div id="launchCountdown" class="countdown"></div>
        <button class="back-to-launch-button" onclick="returnToLaunchScreen()">Back to Launch</button>
    </div>

    <audio id="buzzerSound" src="buzzer.mp3"></audio>
    <audio id="beepSound" src="beep-07a.mp3" preload="auto"></audio>

    <script>
        let countdownInterval;
        let countdownContainer = document.getElementById('countdownContainer');
        let launchScreen = document.getElementById('launchScreen');
        let countdownElement = document.getElementById('countdown');
        let buzzerSound = document.getElementById('buzzerSound');
        let beepSound = document.getElementById('beepSound'); // Reference to the beep sound
        let launchVideo = document.getElementById('launchVideo');
        let launchCountdownElement = document.getElementById('launchCountdown');
    
        window.onload = function() {
            document.getElementById("launched").style.display = "none";
            setTimeout(function() {
                localStorage.setItem('nuclear', 'true');
                returnToLaunchScreen();
                document.getElementById("launched").style.display = "block";
            }, 600);
        };
    
        function showCodeModal() {
            document.getElementById('codeModal').style.display = 'block';
            document.getElementById('launchButton').style.display = 'none';
        }
    
        function validateCode() {
            const code = document.getElementById('launchCode').value;
            if (code === 'B662') {
                document.getElementById('codeModal').style.display = 'none';
                showCountryModal();
            } else {
                playBuzzer();
                showErrorScreen("errorScreen");
            }
        }
    
        function showCountryModal() {
            document.getElementById('countryModal').style.display = 'block';
        }
    
        function confirmCountry() {
            const selectedCountry = document.getElementById('countrySelect').value;
            if (selectedCountry) {
                document.getElementById('countryModal').style.display = 'none';
                document.getElementById('targetCountryHeading').innerText = `Target - ${selectedCountry}`;
                startCountdown();
            } else {
                alert('Choose a country');
            }
        }
    
        function playBeep() {
            beepSound.play(); // Play the beep sound
        }
    
        function startCountdown() {
            countdownContainer.style.display = 'block';
            let totalMilliseconds = 60000;
            let previousSeconds = Math.floor(totalMilliseconds / 1000);
    
            countdownInterval = setInterval(function () {
                const minutes = Math.floor(totalMilliseconds / 60000);
                const seconds = Math.floor((totalMilliseconds % 60000) / 1000);
                const milliseconds = totalMilliseconds % 1000;
    
                countdownElement.innerHTML = 
                    `${minutes.toString().padStart(2, '0')}:` +
                    `${seconds.toString().padStart(2, '0')}:` +
                    `${milliseconds.toString().padStart(3, '0')}`;
    
                totalMilliseconds -= 10;
    
                // Play beep sound every second
                const currentSeconds = Math.floor(totalMilliseconds / 1000);
                if (currentSeconds !== previousSeconds) {
                    playBeep();
                    previousSeconds = currentSeconds;
                }
    
                if (totalMilliseconds < 0) {
                    clearInterval(countdownInterval);
                    countdownElement.innerHTML = "00:00:000";
                    beepSound.pause(); // Stop the beep sound when countdown ends
                    beepSound.currentTime = 0; // Reset audio to start
                    setTimeout(showLaunchScreen, 200);
                }
            }, 10);
        }
    
        function showLaunchScreen() {
            countdownContainer.style.display = 'none';
            launchScreen.style.display = 'block';
            startPostLaunchCountdown();
        }
    
        function startPostLaunchCountdown() {
            launchCountdownElement.style.display = 'block';
            let seconds = 9;
    
            const postLaunchInterval = setInterval(function () {
                launchCountdownElement.innerHTML = `Redirecting in ${seconds} seconds...`;
                seconds--;
    
                if (seconds < 0) {
                    clearInterval(postLaunchInterval);
                    setTimeout(() => {
                        window.location.href = 'path.html';
                    }, 10); // Redirect after 1 second delay
                }
            }, 1000);
        }
    
        function abortLaunch() {
            clearInterval(countdownInterval);
            countdownContainer.style.display = 'none';
            document.getElementById('launchButton').style.display = 'none';
            playBuzzer();
            beepSound.pause();
            showErrorScreen("abortScreen");
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 5000); // Redirect after 5 seconds
        }
    
        function playBuzzer() {
            buzzerSound.play();
        }
    
        function stopBuzzer() {
            buzzerSound.pause();
            buzzerSound.currentTime = 0;
        }
    
        function showErrorScreen(screenId) {
            document.getElementById('codeModal').style.display = 'none';
            document.getElementById('countryModal').style.display = 'none';
            countdownContainer.style.display = 'none';
            document.getElementById('errorScreen').style.display = 'none';
            document.getElementById('abortScreen').style.display = 'none';
            launchScreen.style.display = 'none';
            document.getElementById(screenId).style.display = 'block';
    
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 5000); // Redirect after 5 seconds
        }
    
        function hideErrorScreen() {
            stopBuzzer();
            document.getElementById('errorScreen').style.display = 'none';
            document.getElementById('launchButton').style.display = 'block';
        }
    
        function hideAbortScreen() {
            stopBuzzer();
            document.getElementById('abortScreen').style.display = 'none';
            document.getElementById('launchButton').style.display = 'block';
        }
    
        function returnToLaunchScreen() {
            launchScreen.style.display = 'none';
            document.getElementById('countdownContainer').style.display = 'none';
            document.getElementById('codeModal').style.display = 'none';
            document.getElementById('countryModal').style.display = 'none';
            document.getElementById('errorScreen').style.display = 'none';
            document.getElementById('abortScreen').style.display = 'none';
            document.getElementById('launchButton').style.display = 'block';
        }
    </script>
    
    
    </body>
    </html>
