<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body onload="set();">
    <header>
        <h1>Research and Analysis Wing</h1>
    </header>
    <div class="dashboard-container">
        <div class="dashboard-box">
            <button id="button_undercover" class="btn">Undercover</button>
            <button onclick="window.location = 'chat.html'" id="button1" class="btn">Chats</button>
            <button onclick="window.location = 'gallery.html'" id="button2" class="btn">Gallery</button>
            <button onclick="window.location = 'id.html'" id="button2" class="btn">My ID-Card</button>
            <button onclick="window.location = 'morse_code.html'" id="button3" class="btn">Morse Code</button>
            <button onclick="window.location = 'weapon.html'" id="my_weapon" class="btn">My Weapon</button>
            <button onclick="window.location = 'whiteboard.html'" class="btn">Whiteboard</button>
            <button onclick="window.location = 'map.html'" class="btn">Head Quaters</button>
            <button onclick="window.location = 'nuclear.html'" id="button5" class="btn">Nuclear Strike</button>
            <button onclick="window.location = 'gps.html'" id="button1" class="btn">GPS Bug</button>
            <button onclick="window.location = 'resign.html'" id="button5" class="btn">Resign</button>
        </div>
    </div>
    <div class="scrolling-text">
        <marquee behavior="scroll" direction="left">
            <span class="warning-text">This is a Government website. Any changes made unofficially will lead to imprisonment! This is an INDIAN Government website and has all copyrights 🇮🇳</span>
        </marquee>
    </div>

    <script>
        // Function to handle the undercover button click
        document.getElementById('button_undercover').onclick = function() {
            window.location.href = 'undercover.html';
        };

        function set(){
            localStorage.setItem("page_raw", "dashboard.html");
        }
    </script>
</body>
</html>
